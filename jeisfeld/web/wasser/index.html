<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solea lebt! - Wasser</title>
<style>
body {
	font-family: system-ui, sans-serif;
	margin: 0;
	background: #111;
	color: #eee;
}

.wrap {
	max-width: 900px;
	margin: 0 auto;
	padding: 24px;
	display: grid;
	gap: 24px;
	grid-template-columns: 280px 1fr;
}

img {
	width: 100%;
	border-radius: 12px;
	box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
}

.album-links {
	display: grid;
	grid-template-columns: repeat(auto-fill, 72px);
	gap: 10px;
	margin-top: 14px;
}

.album-links a {
	display: block;
	border-radius: 8px;
}

.album-links img {
	display: block;
	border-radius: 8px;
	box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
	transition: opacity .2s;
}

.album-links a:hover img,
.album-links a:focus-visible img {
	opacity: .75;
}

h1 {
	margin: 0 0 8px;
	font-size: 24px;
}

audio {
	width: 100%;
	margin: 12px 0 8px;
}

ul {
	list-style: none;
	padding: 0;
	margin: 0;
	border-radius: 12px;
	overflow: hidden;
	border: 1px solid #2a2a2a;
}

li {
	display: flex;
	justify-content: space-between;
	gap: 12px;
	padding: 3px 14px;
	cursor: pointer;
	background: #161616;
	border-top: 1px solid #2a2a2a;
}

li:first-child {
	border-top: 0;
}

li:hover {
	background: #1d1d1d;
}

li.active {
	background: #2a2a2a;
}

.meta {
	opacity: .7;
	font-size: 13px;
}

.row {
	display: flex;
	align-items: baseline;
	gap: 10px;
}

button {
	background: #2a2a2a;
	color: #eee;
	border: 1px solid #3a3a3a;
	padding: 10px 12px;
	border-radius: 10px;
	cursor: pointer;
}

button:hover {
	background: #333;
}

.icon-btn {
	font-size: 18px;
	line-height: 1;
	min-width: 46px;
	padding: 10px;
}

.social-links {
	margin-top: 14px;
	display: grid;
	gap: 8px;
}

.social-links a {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 8px 10px;
	background: #161616;
	border: 1px solid #2a2a2a;
	border-radius: 10px;
	color: #eee;
	text-decoration: none;
}

.social-links a:hover {
	background: #1d1d1d;
}

.icon {
	width: 20px;
	height: 20px;
	fill: currentColor;
}

@media ( max-width : 760px) {
	.wrap {
		grid-template-columns: 1fr;
	}
}


@media ( max-width : 480px) {
	.wrap {
		padding: 16px;
	}

	li {
		padding: 3px 8px;
	}

	.row {
		font-size: 14px;
		gap: 6px;
	}
}
</style>
</head>
<body>
	<div class="wrap">
		<div>
			<img src="cover.jpg" alt="Album cover" />
			<nav class="album-links" id="albumLinks" aria-label="Other albums"></nav>

			<div class="social-links">
				<a href="https://www.youtube.com/watch?v=3ub7k_aOFwo&list=OLAK5uy_mFvk4u5BsCX2UFr3cBlEB6SV9mccwmiGs" target="_blank"
					rel="noopener noreferrer">
					<svg class="icon" aria-hidden="true">
						<use xlink:href="/img/icons.svg#icon-youtube"></use>
					</svg>
					Youtube
				</a>
				<a href="https://open.spotify.com/album/6LyrMa6oD5M6VEp1zbIF1a" target="_blank" rel="noopener noreferrer">
					<svg class="icon" aria-hidden="true">
						<use xlink:href="/img/icons.svg#icon-spotify"></use>
					</svg>
					Spotify
				</a>
				<a href="https://music.apple.com/us/album/wasser/6771767187" target="_blank" rel="noopener noreferrer">
					<svg class="icon" aria-hidden="true">
						<use xlink:href="/img/icons.svg?v=3#icon-apple-music"></use>
					</svg>
					Apple Music
				</a>
				<a href="https://amazon.de/music/player/albums/B0H2G21ZGQ" target="_blank" rel="noopener noreferrer">
					<svg class="icon" aria-hidden="true">
						<use xlink:href="/img/icons.svg#icon-amazon-music"></use>
					</svg>
					Amazon Music
				</a>
				<a href="https://deezer.com/de/album/987465251" target="_blank" rel="noopener noreferrer">
					<svg class="icon" aria-hidden="true">
						<use xlink:href="/img/icons.svg#icon-deezer"></use>
					</svg>
					Deezer
				</a>
				<a href="https://tidal.com/album/526607660" target="_blank" rel="noopener noreferrer">
					<svg class="icon" aria-hidden="true">
						<use xlink:href="/img/icons.svg#icon-tidal"></use>
					</svg>
					Tidal
				</a>
			</div>
		</div>

		<div>
			<h1 id="albumTitle">Solea lebt! - Wasser</h1>
			<div class="meta" id="nowPlaying">Not playing</div>

			<audio id="player" controls preload="metadata"></audio>

			<div style="display: flex; gap: 10px; margin: 10px 0 14px;">
				<button id="prevBtn" class="icon-btn" type="button" aria-label="Previous track" title="Previous track">⏮</button>
				<button id="playPauseBtn" class="icon-btn" type="button" aria-label="Play or pause" title="Play/Pause">⏯</button>
				<button id="nextBtn" class="icon-btn" type="button" aria-label="Next track" title="Next track">⏭</button>
			</div>

			<ul id="playlist"></ul>
		</div>
	</div>

	<script>
    // Add future albums here; the current album is omitted automatically.
	const albums = [
	  { slug: "indiewelt", title: "In die Welt" },
	  { slug: "wasser", title: "Wasser" },
	  { slug: "neuewellen", title: "Neue Wellen" },
	];
	const currentAlbum = "wasser";
	const albumLinks = document.getElementById("albumLinks");
	albums.filter((album) => album.slug !== currentAlbum).forEach((album) => {
	  const link = document.createElement("a");
	  const cover = document.createElement("img");
	  link.href = `/${album.slug}/`;
	  link.title = album.title;
	  link.setAttribute("aria-label", `Open album ${album.title}`);
	  cover.src = `/${album.slug}/cover.jpg`;
	  cover.alt = `${album.title} album cover`;
	  link.appendChild(cover);
	  albumLinks.appendChild(link);
	});

    // 1) Edit this list to match your MP3 files
	const tracks = [
	  { title: "Ich reise zu mir selbst", file: "tracks/01 Ich reise zu mir selbst.mp3" },
	  { title: "Geliebte Seele", file: "tracks/02 Geliebte Seele.mp3" },
	  { title: "Zu Hause", file: "tracks/03 Zu Hause.mp3" },
	  { title: "In der Bahn", file: "tracks/04 In der Bahn.mp3" },
	  { title: "Ich bin das Wasser", file: "tracks/05 Ich bin das Wasser.mp3" },
	  { title: "Keine Träne mehr", file: "tracks/06 Keine Träne mehr.mp3" },
	  { title: "Besessen", file: "tracks/07 Besessen.mp3" },
	  { title: "Keine Worte mehr", file: "tracks/08 Keine Worte mehr.mp3" },
	  { title: "Ich reise zu mir selbst (Ambient Mix)", file: "tracks/09 Ich reise zu mir selbst (Ambient.mp3" },
	  { title: "Geliebte Seele (Trip Mix)", file: "tracks/10 Geliebte Seele (Trip Mix).mp3" },
	  { title: "Zu Hause (Punk Mix)", file: "tracks/11 Zu Hause (Punk Mix).mp3" },
	  { title: "In der Bahn (Chanson Mix)", file: "tracks/12 In der Bahn (Chanson Mix).mp3" },
	  { title: "Ich bin das Wasser (Bathroom Mix)", file: "tracks/13 Ich bin das Wasser (Bathroom Mix).mp3" },
	  { title: "Keine Träne mehr (Doom Mix)", file: "tracks/14 Keine Träne mehr (Doom Mix).mp3" },
	  { title: "Besessen (Gothic Mix)", file: "tracks/15 Besessen (Gothic Mix).mp3" },
	  { title: "Keine Worte mehr (Ambient Mix)", file: "tracks/16 Keine Worte mehr (Ambient Mix).mp3" },
	  { title: "Wiedergeburt", file: "tracks/17 Wiedergeburt.mp3" },
	  { title: "Unvernünftig sein", file: "tracks/18 Unvernünftig sein.mp3" },
	  { title: "Benutze mich", file: "tracks/19 Benutze mich.mp3" },
	  { title: "(V)Erleben", file: "tracks/20 (V)Erleben.mp3" },
	];


    const player = document.getElementById("player");
    const playlistEl = document.getElementById("playlist");
    const nowPlayingEl = document.getElementById("nowPlaying");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const playPauseBtn = document.getElementById("playPauseBtn");

    let currentIndex = 0;

    function renderPlaylist() {
      playlistEl.innerHTML = "";
      tracks.forEach((t, i) => {
        const li = document.createElement("li");
        li.dataset.index = i;

        const left = document.createElement("div");
        left.className = "row";
        left.innerHTML = `<strong>${String(i + 1).padStart(2, "0")}.</strong> <span>${t.title}</span>`;

        const right = document.createElement("div");
        right.className = "meta";
        right.textContent = "▶";

        li.appendChild(left);
        li.appendChild(right);

        li.addEventListener("click", () => playIndex(i, true));
        playlistEl.appendChild(li);
      });
      highlightActive();
    }

    function highlightActive() {
      [...playlistEl.children].forEach((li) => li.classList.remove("active"));
      const active = playlistEl.children[currentIndex];
      if (active) active.classList.add("active");
    }

    function setNowPlaying(text) {
      nowPlayingEl.textContent = text;
    }

    function playIndex(index, autoplay = false) {
      if (index < 0 || index >= tracks.length) return;
      currentIndex = index;

      player.src = tracks[currentIndex].file;
      player.load();

      highlightActive();
      setNowPlaying(`Selected: ${tracks[currentIndex].title}`);

      if (autoplay) {
        // Note: some browsers require a user gesture before audio playback.
        player.play().then(() => {
          setNowPlaying(`Playing: ${tracks[currentIndex].title}`);
        }).catch(() => {
          setNowPlaying(`Ready to play: ${tracks[currentIndex].title} (press Play)`);
        });
      }
    }

    function nextTrack() {
      const next = (currentIndex + 1) % tracks.length; // loop back to start
      playIndex(next, true);
    }

    function prevTrack() {
      const prev = (currentIndex - 1 + tracks.length) % tracks.length;
      playIndex(prev, true);
    }

    // Auto-advance when a song ends
    player.addEventListener("ended", nextTrack);

    // Update UI on play/pause
    player.addEventListener("play", () => setNowPlaying(`Playing: ${tracks[currentIndex].title}`));
    player.addEventListener("pause", () => setNowPlaying(`Paused: ${tracks[currentIndex].title}`));

    prevBtn.addEventListener("click", prevTrack);
    nextBtn.addEventListener("click", nextTrack);
    playPauseBtn.addEventListener("click", () => {
      if (player.paused) player.play();
      else player.pause();
    });

    // Init
    renderPlaylist();
    playIndex(0, false);
  </script>
</body>
</html>
